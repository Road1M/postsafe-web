<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070707">
<title>Lineal</title>
<style>
html,body{margin:0; background:#070707; color:#fff; font:600 13px/1.2 -apple-system,system-ui,sans-serif}
/* Normaler Inhalt: graue Streifen alle 20px, darauf Zahlen alle 100px */
.seite{height:6000px; background:repeating-linear-gradient(to bottom, #444 0 10px, #070707 10px 20px)}
/* Fest: rot/weiß alle 10px, genau so hoch wie das Fenster */
.fest{position:fixed; top:0; left:22%; width:16%; height:100lvh; background:repeating-linear-gradient(to bottom, #e33 0 10px, #fff 10px 20px)}
/* Fest, oben und unten 150px über den Rand hinaus: grün */
.fest2{position:fixed; top:-150px; left:42%; width:16%; height:calc(100lvh + 300px); background:repeating-linear-gradient(to bottom, #2c4 0 10px, #fff 10px 20px)}
/* Klebend: blau */
.halter{position:absolute; top:0; left:62%; width:16%; height:6000px}
.klebt{position:sticky; top:0; height:100lvh; background:repeating-linear-gradient(to bottom, #36f 0 10px, #fff 10px 20px)}
.info{position:fixed; left:50%; top:45%; transform:translate(-50%,-50%); background:#000; padding:10px 14px; border-radius:10px; white-space:pre; z-index:5; font-size:15px}
.marke{position:absolute; left:4px; font-size:11px; color:#ff0}
</style>
</head>
<body>
<div class="seite"></div>
<div class="halter"><div class="klebt"></div></div>
<div class="fest"></div>
<div class="fest2"></div>
<div class="info" id="info"></div>
<script>
const probe = h => { const d = document.createElement("div"); d.style.cssText = "position:absolute;visibility:hidden;width:1px;height:" + h; document.body.append(d); const v = d.offsetHeight; d.remove(); return v; };
const sa = (() => { const d = document.createElement("div"); d.style.cssText = "position:fixed;visibility:hidden;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom)"; document.body.append(d); return d; })();
const show = () => { const r = sa.getBoundingClientRect();
  document.getElementById("info").textContent = `innerHeight ${innerHeight}\nvisualViewport ${Math.round(visualViewport.height)} @${Math.round(visualViewport.offsetTop)}\nsvh ${probe("100svh")}  lvh ${probe("100lvh")}  dvh ${probe("100dvh")}\nsafe oben ${Math.round(r.top)} unten ${Math.round(innerHeight - r.bottom)}\nscrollY ${Math.round(scrollY)}`; };
for (let y = 0; y < 6000; y += 100) { const m = document.createElement("div"); m.className = "marke"; m.style.top = y + "px"; m.textContent = y; document.body.append(m); }
addEventListener("scroll", show, { passive: true }); addEventListener("resize", show); setInterval(show, 300); show();
</script>
</body>
</html>
